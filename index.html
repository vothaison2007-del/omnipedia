<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniPedia - Bí Quyết & Sự Thật Thú Vị</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    }
  </script>
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-flipped .card-inner { transform: rotateY(180deg); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-2xl">💡</span>
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          OmniPedia
        </span>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <button id="surpriseBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white rounded-lg shadow-sm transition active:scale-95">
          <span>🎲</span>
          <span class="hidden sm:inline">Khám phá ngẫu nhiên</span>
        </button>

        <button id="quizBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition active:scale-95">
          <span>🎯</span>
          <span class="hidden sm:inline">Mini-game</span>
        </button>

        <button id="themeToggle" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition" title="Chuyển chế độ sáng/tối">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Hero Section -->
    <div class="text-center max-w-2xl mx-auto mb-8">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">
        Kho Kiến Thức & Mẹo Vặt Đời Sống
      </h1>
      <p class="text-slate-400 text-sm sm:text-base">
        Nhấn vào bất kỳ thẻ nào để lật xem bản chất khoa học và nguyên lý hoạt động đằng sau.
      </p>
    </div>

    <!-- Search & Filter Controls -->
    <div class="space-y-4 mb-8">
      <div class="max-w-xl mx-auto">
        <div class="relative">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Tìm mẹo vặt, cơ chế khoa học, hashtag..." 
            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm shadow-inner"
          >
          <span class="absolute left-3.5 top-2.5 text-slate-400">🔍</span>
        </div>
      </div>

      <!-- Categories & Favorite Filter -->
      <div class="flex flex-wrap items-center justify-center gap-2" id="categoryContainer">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards rendered by JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16">
      <div class="text-5xl mb-3">🔍</div>
      <p class="text-lg font-medium text-slate-300">Không tìm thấy nội dung phù hợp</p>
      <p class="text-sm text-slate-500">Hãy thử tìm với từ khóa hoặc danh mục khác.</p>
    </div>
  </main>

  <!-- Quiz Modal -->
  <div id="quizModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl shadow-2xl p-6 relative">
      <button id="closeQuiz" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl p-1 leading-none">&times;</button>
      
      <div id="quizContent">
        <!-- Quiz content handled by JS -->
      </div>
    </div>
  </div>

  <script>
    // Audio synthesizer via Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 600, duration = 0.08, type = "sine") {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Knowledge dataset
    const tipsData = [
      {
        id: 1,
        title: "Bọc cuống chuối để lâu bị thâm",
        category: "Ẩm thực & Bếp",
        icon: "🍌",
        tags: ["#bao_quan", "#hoa_qua", "#ethylene"],
        tip: "Dùng màng bọc thực phẩm hoặc giấy bạc bọc kín phần cuống nải chuối. Chuối sẽ tươi lâu hơn từ 3-5 ngày so với để trần.",
        science: "Khí Ethylene (hormone kích thích chín tự nhiên ở thực vật) được giải phóng chủ yếu từ phần cuống chuối. Khi bị bịt kín, khí này lan chậm hơn tới phần thân quả, kéo dài quá trình phân hủy tinh bột thành đường."
      },
      {
        id: 2,
        title: "Quy tắc 2 phút trị tính trì hoãn",
        category: "Tâm lý học",
        icon: "⏳",
        tags: ["#nang_suat", "#thoi_quen", "#ky_luat"],
        tip: "Nếu một việc mất chưa tới 2 phút để xử lý (rửa cái bát, trả lời email, dọn bàn), hãy làm nó ngay lập tức mà không cần ghi vào danh sách.",
        science: "Bộ não con người tiêu tốn nhiều năng lượng để nhớ và trì hoãn một việc nhỏ hơn là thực hiện nó. Bắt đầu hành động 2 phút giúp vượt qua 'ma sát quán tính ban đầu', kích thích dopamine để duy trì đà làm việc."
      },
      {
        id: 3,
        title: "Mở lại tab vừa đóng nhầm trên trình duyệt",
        category: "Công nghệ",
        icon: "💻",
        tags: ["#phim_tat", "#chrome", "#trinh_duyet"],
        tip: "Bấm tổ hợp phím Ctrl + Shift + T (hoặc Cmd + Shift + T trên Mac) để khôi phục tab vừa tắt. Bấm liên tục để mở lại nhiều tab trước đó.",
        science: "Trình duyệt lưu trữ lịch sử phiên làm việc hiện tại vào bộ nhớ đệm (Session Stack). Phím tắt này gọi trực tiếp hàm pop() ngăn xếp tab đã đóng gần nhất mà không cần vào History."
      },
      {
        id: 4,
        title: "Nước nóng đông đá nhanh hơn nước lạnh",
        category: "Khoa học thường thức",
        icon: "❄️",
        tags: ["#vat_ly", "#mpemba", "#nuoc"],
        tip: "Trong một số điều kiện làm lạnh nhanh, nước ấm hoặc nóng có thể đóng băng hoàn toàn sớm hơn nước lạnh cùng thể tích.",
        science: "Đây là hiệu ứng Mpemba (Mpemba Effect). Nguyên nhân bao gồm tốc độ bay hơi bề mặt làm giảm khối lượng, dòng đối lưu nhiệt diễn ra mạnh hơn và liên kết hydro trong nước nóng dãn nở giúp giải phóng nhiệt nhanh hơn."
      },
      {
        id: 5,
        title: "Khử mùi hôi và vết ố thớt gỗ tức thì",
        category: "Ẩm thực & Bếp",
        icon: "🍋",
        tags: ["#ve_sinh", "#nha_bep", "#chanh"],
        tip: "Rắc muối hạt dày lên mặt thớt, dùng nửa quả chanh chà xát mạnh theo vòng tròn rồi tráng bằng nước ấm.",
        science: "Axit citric trong chanh phá hủy màng tế bào vi khuẩn gây mùi kết hợp với tính hút ẩm, diệt khuẩn và độ mài mòn cơ học của tinh thể muối hạt giúp kéo dịch bẩn sâu trong thớ gỗ ra ngoài."
      },
      {
        id: 6,
        title: "Tìm kiếm chính xác định dạng file trên Google",
        category: "Công nghệ",
        icon: "🔎",
        tags: ["#google_search", "#meo_tim_kiem", "#hoc_tap"],
        tip: "Thêm cú pháp 'filetype:pdf' hoặc 'filetype:xlsx' sau từ khóa tìm kiếm (Ví dụ: Giáo trình Vi sinh vật filetype:pdf) để tải trực tiếp tài liệu.",
        science: "Công cụ tìm kiếm của Google đánh chỉ mục (Index) cấu trúc MIME và phần mở rộng tập tin độc lập. Cú pháp 'filetype:' buộc bộ lọc chỉ trả về các bản ghi trùng khớp header định dạng cụ thể."
      },
      {
        id: 7,
        title: "Hiệu ứng Zeigarnik: Não nhớ việc dở dang",
        category: "Tâm lý học",
        icon: "🧠",
        tags: ["#tri_nho", "#tap_trung", "#tam_ly"],
        tip: "Khi bị tắc ý tưởng làm việc hoặc học tập, hãy dừng lại giữa chừng ở điểm bạn đang hiểu rõ nhất thay vì cố làm cạn kiệt.",
        science: "Nhà tâm lý học Bluma Zeigarnik chứng minh não bộ duy trì trạng thái căng thẳng nhận thức (cognitive tension) với các tác vụ chưa hoàn thành. Trạng thái này giúp não ngầm xử lý thông tin dưới tiềm thức ngay cả khi bạn đang nghỉ ngơi."
      },
      {
        id: 8,
        title: "Làm mát lon nước ngọt trong 2 phút",
        category: "Khoa học thường thức",
        icon: "🧊",
        tags: ["#meo_vat", "#nhiet_hoc", "#giai_khat"],
        tip: "Cho lon nước vào bát nước đá, thêm 2 muỗng muối ăn lớn và khuấy đều trong 2 phút. Lon nước sẽ lạnh buốt ngay lập tức.",
        science: "Hiện tượng hạ điểm đóng băng: Muối làm tan băng nhưng quá trình hòa tan muối lại là phản ứng thu nhiệt mạnh, kéo nhiệt độ của hỗn hợp nước muối đá xuống dưới 0°C (-3°C đến -5°C), giúp truyền nhiệt cực nhanh từ vỏ lon ra ngoài."
      },
      {
        id: 9,
        title: "Giảm mỏi mắt với quy tắc 20-20-20",
        category: "Đời sống",
        icon: "👀",
        tags: ["#suc_khoe", "#mat", "#man_hinh"],
        tip: "Cứ sau mỗi 20 phút nhìn màn hình, hãy nhìn vào một vật cách xa ít nhất 20 feet (khoảng 6 mét) trong vòng 20 giây.",
        science: "Cơ thể mi (Ciliary muscle) trong mắt phải co lại liên tục để điều tiết khi nhìn gần. Nhìn xa 6m đưa mắt về tiêu cự vô cực, giúp nhóm cơ này giãn ra hoàn toàn, giảm áp lực nội nhãn và khô giác mạc."
      }
    ];

    const quizQuestions = [
      {
        question: "Cắm sạc điện thoại qua đêm sẽ làm chai pin hoặc nổ pin?",
        isTrue: false,
        explanation: "Sai. Các smartphone hiện đại đều có IC quản lý nguồn thông minh, tự động ngắt dòng điện vào cell pin khi đạt 100% và chỉ dùng điện trực tiếp từ bộ sạc."
      },
      {
        question: "Nuốt kẹo cao su sẽ nằm trong dạ dày suốt 7 năm?",
        isTrue: false,
        explanation: "Sai. Đế kẹo cao su không bị tiêu hóa bởi enzym dạ dày nhưng vẫn được nhu động ruột đẩy ra ngoài theo đường tiêu hóa tự nhiên chỉ sau 1-3 ngày."
      },
      {
        question: "Muối thêm vào nước đá có thể làm nhiệt độ nước đá hạ xuống dưới 0°C?",
        isTrue: true,
        explanation: "Đúng. Hiện tượng hạ điểm đông đặc kết hợp với quá trình muối hòa tan thu nhiệt giúp nhiệt độ hỗn hợp giảm sâu tới -4°C hoặc thấp hơn."
      },
      {
        question: "Não người chỉ hoạt động khoảng 10% công suất?",
        isTrue: false,
        explanation: "Sai. Hình ảnh cộng hưởng từ chức năng (fMRI) cho thấy gần như toàn bộ các vùng não đều hoạt động liên tục ngay cả khi ta ngủ."
      }
    ];

    // State
    let activeCategory = 'Tất cả';
    let searchQuery = '';
    let favorites = JSON.parse(localStorage.getItem('omnipedia_favs') || '[]');
    let currentQuizIndex = 0;
    let quizScore = 0;

    // Categories init
    const categories = ['Tất cả', 'Yêu thích', ...new Set(tipsData.map(t => t.category))];

    function renderCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = categories.map(cat => {
        const isActive = cat === activeCategory;
        return `
          <button 
            onclick="setCategory('${cat}')" 
            class="px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium transition duration-200 border ${
              isActive 
                ? 'bg-indigo-600 border-indigo-500 text-white shadow-md' 
                : 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'
            }"
          >
            ${cat === 'Yêu thích' ? '⭐ Yêu thích (' + favorites.length + ')' : cat}
          </button>
        `;
      }).join('');
    }

    function setCategory(cat) {
      playBeep(450, 0.05);
      activeCategory = cat;
      renderCategories();
      renderCards();
    }

    function toggleFavorite(id, e) {
      e.stopPropagation();
      playBeep(700, 0.08);
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('omnipedia_favs', JSON.stringify(favorites));
      renderCategories();
      renderCards();
    }

    function toggleFlip(cardEl) {
      playBeep(520, 0.06);
      cardEl.classList.toggle('card-flipped');
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');

      const filtered = tipsData.filter(item => {
        const matchCategory = 
          activeCategory === 'Tất cả' ? true :
          activeCategory === 'Yêu thích' ? favorites.includes(item.id) :
          item.category === activeCategory;

        const q = searchQuery.toLowerCase().trim();
        const matchSearch = 
          item.title.toLowerCase().includes(q) ||
          item.tip.toLowerCase().includes(q) ||
          item.science.toLowerCase().includes(q) ||
          item.tags.some(t => t.toLowerCase().includes(q));

        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = filtered.map(item => {
        const isFav = favorites.includes(item.id);
        return `
          <div 
            id="card-${item.id}"
            class="perspective-1000 h-80 cursor-pointer select-none group"
            onclick="toggleFlip(this)"
          >
            <div class="card-inner relative w-full h-full transform-style-3d">
              
              <!-- Front Face (Mẹo) -->
              <div class="absolute inset-0 backface-hidden rounded-2xl bg-slate-800 border border-slate-700/80 p-5 flex flex-col justify-between shadow-lg hover:border-indigo-500/50 transition">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-3">
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                      ${item.category}
                    </span>
                    <button 
                      onclick="toggleFavorite(${item.id}, event)" 
                      class="text-lg p-1 text-slate-400 hover:text-amber-400 transition"
                      title="Lưu yêu thích"
                    >
                      ${isFav ? '★' : '☆'}
                    </button>
                  </div>
                  <h3 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
                    <span>${item.icon}</span>
                    <span>${item.title}</span>
                  </h3>
                  <p class="text-slate-300 text-sm leading-relaxed">${item.tip}</p>
                </div>
                
                <div>
                  <div class="flex flex-wrap gap-1.5 mb-3">
                    ${item.tags.map(t => `<span class="text-[11px] text-slate-400 font-mono">${t}</span>`).join(' ')}
                  </div>
                  <div class="pt-2 border-t border-slate-700/50 flex items-center justify-between text-xs text-indigo-400 font-medium">
                    <span>Nhấn để xem cơ chế khoa học</span>
                    <span>⟳ Lật thẻ</span>
                  </div>
                </div>
              </div>

              <!-- Back Face (Cơ chế khoa học) -->
              <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-2xl bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-900 border border-indigo-500/40 p-5 flex flex-col justify-between shadow-xl">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-semibold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300">
                      🔬 Bản chất khoa học
                    </span>
                    <span class="text-xs text-slate-400">ID: #${item.id}</span>
                  </div>
                  <h4 class="text-base font-bold text-indigo-200 mb-2">${item.title}</h4>
                  <p class="text-slate-200 text-xs sm:text-sm leading-relaxed">${item.science}</p>
                </div>

                <div class="pt-2 border-t border-slate-700/50 flex items-center justify-between text-xs text-slate-400">
                  <span>Nhấn để quay lại</span>
                  <span>↺ Mặt trước</span>
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    // Surprise Me
    document.getElementById('surpriseBtn').addEventListener('click', () => {
      playBeep(880, 0.15);
      confetti({
        particleCount: 70,
        spread: 60,
        origin: { y: 0.2 }
      });

      const randomIndex = Math.floor(Math.random() * tipsData.length);
      const targetTip = tipsData[randomIndex];
      
      activeCategory = 'Tất cả';
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      renderCategories();
      renderCards();

      const el = document.getElementById(`card-${targetTip.id}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('ring-2', 'ring-amber-400', 'rounded-2xl');
        setTimeout(() => {
          el.classList.toggle('card-flipped');
          setTimeout(() => el.classList.remove('ring-2', 'ring-amber-400'), 2000);
        }, 500);
      }
    });

    // Search input
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    themeToggle.addEventListener('click', () => {
      playBeep(500, 0.05);
      const isDark = document.documentElement.classList.toggle('dark');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
    });

    // Quiz logic
    const quizModal = document.getElementById('quizModal');
    const quizBtn = document.getElementById('quizBtn');
    const closeQuiz = document.getElementById('closeQuiz');
    const quizContent = document.getElementById('quizContent');

    quizBtn.addEventListener('click', () => {
      currentQuizIndex = 0;
      quizScore = 0;
      quizModal.classList.remove('hidden');
      renderQuizQuestion();
    });

    closeQuiz.addEventListener('click', () => {
      quizModal.classList.add('hidden');
    });

    function renderQuizQuestion() {
      if (currentQuizIndex >= quizQuestions.length) {
        quizContent.innerHTML = `
          <div class="text-center py-4">
            <div class="text-4xl mb-3">🏆</div>
            <h3 class="text-xl font-bold text-white mb-2">Hoàn thành thử thách!</h3>
            <p class="text-slate-300 text-sm mb-6">Bạn trả lời đúng <span class="font-bold text-indigo-400">${quizScore}/${quizQuestions.length}</span> câu hỏi.</p>
            <button onclick="quizModal.classList.add('hidden')" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">Đóng lại</button>
          </div>
        `;
        return;
      }

      const q = quizQuestions[currentQuizIndex];
      quizContent.innerHTML = `
        <div>
          <div class="flex items-center justify-between text-xs text-slate-400 mb-3">
            <span>Câu ${currentQuizIndex + 1} / ${quizQuestions.length}</span>
            <span>Điểm hiện tại: ${quizScore}</span>
          </div>
          <h3 class="text-base sm:text-lg font-bold text-white mb-6 leading-snug">${q.question}</h3>
          
          <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="handleAnswer(true)" class="py-2.5 px-4 bg-slate-700 hover:bg-emerald-600 hover:text-white rounded-xl font-semibold text-sm transition">
              ✓ THẬT
            </button>
            <button onclick="handleAnswer(false)" class="py-2.5 px-4 bg-slate-700 hover:bg-rose-600 hover:text-white rounded-xl font-semibold text-sm transition">
              ✗ TIN ĐỒN
            </button>
          </div>
          <div id="quizFeedback" class="text-xs text-slate-300 min-h-[3rem] p-2.5 bg-slate-900/60 rounded-lg hidden"></div>
        </div>
      `;
    }

    window.handleAnswer = function(answer) {
      const q = quizQuestions[currentQuizIndex];
      const isCorrect = answer === q.isTrue;
      const feedback = document.getElementById('quizFeedback');

      if (isCorrect) {
        quizScore++;
        playBeep(780, 0.1);
      } else {
        playBeep(240, 0.15, 'sawtooth');
      }

      feedback.classList.remove('hidden');
      feedback.innerHTML = `
        <span class="${isCorrect ? 'text-emerald-400' : 'text-rose-400'} font-bold">
          ${isCorrect ? 'Chính xác! ' : 'Chưa đúng! '}
        </span>
        ${q.explanation}
      `;

      setTimeout(() => {
        currentQuizIndex++;
        renderQuizQuestion();
      }, 2500);
    };

    // Init run
    renderCategories();
    renderCards();
  </script>
</body>
</html>
